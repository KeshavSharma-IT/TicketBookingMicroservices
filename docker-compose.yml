services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ticketbooking-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TicketBooking@2026!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: ticketbooking-auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TicketBookingAuthDb;User Id=sa;Password=TicketBooking@2026!;TrustServerCertificate=True;
    ports:
      - "5001:8080"
    depends_on:
      - sqlserver

  event-services:
    build:
      context: ./EventServices
      dockerfile: Dockerfile
    container_name: ticketbooking-event-services
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TicketBookingEventDB;User Id=sa;Password=TicketBooking@2026!;TrustServerCertificate=True;
    ports:
      - "5002:8080"
    depends_on:
      - sqlserver

volumes:
  sqlserver_data:
