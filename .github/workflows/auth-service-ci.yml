name: AuthService CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "AuthService/**"
      - ".github/workflows/auth-service-ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "AuthService/**"
      - ".github/workflows/auth-service-ci.yml"

jobs:
  build-and-test:
    name: Build & Test AuthService
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore Dependencies
        run: dotnet restore AuthService/AuthService.slnx

      - name: Build Solution
        run: dotnet build AuthService/AuthService.slnx --configuration Release --no-restore

      - name: Verify Docker Build
        run: docker build -t auth-service:ci -f AuthService/Dockerfile AuthService/
