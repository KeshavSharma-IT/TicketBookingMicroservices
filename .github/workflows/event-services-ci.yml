name: EventServices CI

on:
  push:
    branches: [ "main", "master", "keshavOffice", "keshavoffice", "**" ]
    paths:
      - "EventServices/**"
      - ".github/workflows/event-services-ci.yml"
  pull_request:
    branches: [ "main", "master", "keshavOffice", "keshavoffice", "**" ]
    paths:
      - "EventServices/**"
      - ".github/workflows/event-services-ci.yml"

jobs:
  build-and-test:
    name: Build & Test EventServices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore Dependencies
        run: dotnet restore EventServices/EventServices.slnx

      - name: Build Solution
        run: dotnet build EventServices/EventServices.slnx --configuration Release --no-restore

      - name: Verify Docker Build
        run: docker build -t event-services:ci -f EventServices/Dockerfile EventServices/
